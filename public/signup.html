<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QVSE is moving to RXDT!</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .billboard-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background-color: var(--bg-color, #111);
            color: var(--text-color, #fff);
        }
        .billboard-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #4facfe;
        }
        .billboard-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #bbb;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- Back Arrow -->
        <a href="index.html" class="back-arrow" id="backArrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>

        <div class="billboard-container">
            <h1 class="billboard-title">QVSE is moving to RXDT!</h1>
            <p class="billboard-message">Please wait, you are being redirected to our new registration page...</p>
            <div class="loader"></div>
        </div>
    </div>

    <script>
        // Redirect to new RXDT registration page after 4 seconds
        setTimeout(function() {
            window.location.href = 'https://www.rxdt.site/#/register?invite=RX8T17';
        }, 4000);
    </script>
</body>
</html>
