<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QVSE | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="phone-container dashboard-container">
        <!-- Dashboard Header Card (Yellow) -->
        <div class="dash-header-card">
            <div class="dash-header-top">
                <div class="dash-logo-area">
                    <div class="dash-logo-icon">Q</div>
                    <span class="dash-logo-text">QVSE Exchange</span>
                </div>
                <button class="dash-user-btn" id="profileBtn" title="Account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>
            </div>
            
            <p class="dash-assets-title">Assets</p>
            <a href="index.html" class="dash-login-btn">Login</a>

            <!-- Header Quick Actions Grid -->
            <div class="dash-actions-row">
                <div class="dash-action-item" id="depositBtn">
                    <div class="dash-action-circle">＋</div>
                    <div class="dash-action-label">Deposit</div>
                </div>
                <div class="dash-action-item" id="shareBtn">
                    <div class="dash-action-circle">➔</div>
                    <div class="dash-action-label">Share</div>
                </div>
                <div class="dash-action-item" id="supportBtn">
                    <div class="dash-action-circle">🎧</div>
                    <div class="dash-action-label">Online Service</div>
                </div>
                <div class="dash-action-item" id="withdrawBtn">
                    <div class="dash-action-circle">↑</div>
                    <div class="dash-action-label">Withdraw</div>
                </div>
            </div>
        </div>

        <!-- Promotional Banner -->
        <div class="dash-promo-banner">
            <div class="dash-promo-icon-box">✦</div>
            <div class="dash-promo-text">
                <h4>Connect globally</h4>
                <p>Enjoy ultimate trading speed, and control your wealth anytime, anywhere!</p>
            </div>
        </div>

        <!-- Market Listing Section -->
        <div class="dash-market-section">
            <h3 class="dash-market-title">Market</h3>
            <div class="dash-table-header">
                <span class="dash-col-coin">Coin</span>
                <span class="dash-col-trend">Weekly trend</span>
                <span class="dash-col-price">Price</span>
            </div>
            
            <div class="dash-coin-list" id="coinList">
                <!-- Coin rows will be generated dynamically by dashboard.js -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active" id="navHome">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Home</span>
            </button>
            <button class="nav-item nav-trade-btn" id="navTrade">
                <div class="nav-trade-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </div>
                <span>Trade</span>
            </button>
            <button class="nav-item" id="navContract">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>Contract</span>
            </button>
            <button class="nav-item" id="navAccount">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Account</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage">Action completed</span>
    </div>

    <script src="dashboard.js?v=2"></script>
</body>
</html>
