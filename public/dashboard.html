<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QVSE | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="phone-container dashboard-container">
        <!-- Dashboard Header -->
        <div class="dash-header">
            <div class="dash-header-left">
                <div class="dash-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div>
                    <p class="dash-greeting">Welcome back</p>
                    <p class="dash-username">Trader</p>
                </div>
            </div>
            <div class="dash-header-right">
                <button class="dash-icon-btn" id="notifBtn" title="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notif-badge">3</span>
                </button>
                <button class="dash-icon-btn" id="settingsBtn" title="Settings">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Portfolio Card -->
        <div class="portfolio-card">
            <p class="portfolio-label">Total Portfolio Value</p>
            <h2 class="portfolio-balance" id="portfolioBalance">$12,458.32</h2>
            <div class="portfolio-change positive">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                    <polyline points="17 6 23 6 23 12"/>
                </svg>
                <span>+2.34% today</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="action-btn" id="depositBtn">
                <div class="action-icon deposit-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <polyline points="19 12 12 19 5 12"/>
                    </svg>
                </div>
                <span>Deposit</span>
            </button>
            <button class="action-btn" id="withdrawBtn">
                <div class="action-icon withdraw-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"/>
                        <polyline points="5 12 12 5 19 12"/>
                    </svg>
                </div>
                <span>Withdraw</span>
            </button>
            <button class="action-btn" id="tradeBtn">
                <div class="action-icon trade-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </div>
                <span>Trade</span>
            </button>
            <button class="action-btn" id="moreBtn">
                <div class="action-icon more-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </svg>
                </div>
                <span>More</span>
            </button>
        </div>

        <!-- Market Section -->
        <div class="market-section">
            <div class="market-header">
                <h3 class="market-title">Markets</h3>
                <button class="see-all-btn" id="seeAllBtn">See All</button>
            </div>

            <!-- Market List -->
            <div class="market-list" id="marketList">
                <div class="market-item">
                    <div class="market-item-left">
                        <div class="coin-icon btc-icon">₿</div>
                        <div>
                            <p class="coin-name">BTC</p>
                            <p class="coin-pair">Bitcoin</p>
                        </div>
                    </div>
                    <div class="market-item-center">
                        <div class="mini-chart btc-chart" id="btcChart"></div>
                    </div>
                    <div class="market-item-right">
                        <p class="coin-price">$67,234.18</p>
                        <p class="coin-change positive">+1.82%</p>
                    </div>
                </div>

                <div class="market-item">
                    <div class="market-item-left">
                        <div class="coin-icon eth-icon">Ξ</div>
                        <div>
                            <p class="coin-name">ETH</p>
                            <p class="coin-pair">Ethereum</p>
                        </div>
                    </div>
                    <div class="market-item-center">
                        <div class="mini-chart eth-chart" id="ethChart"></div>
                    </div>
                    <div class="market-item-right">
                        <p class="coin-price">$3,456.92</p>
                        <p class="coin-change positive">+3.15%</p>
                    </div>
                </div>

                <div class="market-item">
                    <div class="market-item-left">
                        <div class="coin-icon sol-icon">◎</div>
                        <div>
                            <p class="coin-name">SOL</p>
                            <p class="coin-pair">Solana</p>
                        </div>
                    </div>
                    <div class="market-item-center">
                        <div class="mini-chart sol-chart" id="solChart"></div>
                    </div>
                    <div class="market-item-right">
                        <p class="coin-price">$178.45</p>
                        <p class="coin-change negative">-0.67%</p>
                    </div>
                </div>

                <div class="market-item">
                    <div class="market-item-left">
                        <div class="coin-icon xrp-icon">✕</div>
                        <div>
                            <p class="coin-name">XRP</p>
                            <p class="coin-pair">Ripple</p>
                        </div>
                    </div>
                    <div class="market-item-center">
                        <div class="mini-chart xrp-chart" id="xrpChart"></div>
                    </div>
                    <div class="market-item-right">
                        <p class="coin-price">$0.6234</p>
                        <p class="coin-change positive">+5.41%</p>
                    </div>
                </div>

                <div class="market-item">
                    <div class="market-item-left">
                        <div class="coin-icon bnb-icon">◆</div>
                        <div>
                            <p class="coin-name">BNB</p>
                            <p class="coin-pair">BNB Chain</p>
                        </div>
                    </div>
                    <div class="market-item-center">
                        <div class="mini-chart bnb-chart" id="bnbChart"></div>
                    </div>
                    <div class="market-item-right">
                        <p class="coin-price">$584.10</p>
                        <p class="coin-change negative">-1.23%</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active" id="navHome">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>Home</span>
            </button>
            <button class="nav-item" id="navMarkets">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                <span>Markets</span>
            </button>
            <button class="nav-item nav-trade-btn" id="navTrade">
                <div class="nav-trade-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </div>
                <span>Trade</span>
            </button>
            <button class="nav-item" id="navWallet">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                    <line x1="1" y1="10" x2="23" y2="10"/>
                </svg>
                <span>Wallet</span>
            </button>
            <button class="nav-item" id="navProfile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage">Action completed</span>
    </div>

    <script src="dashboard.js?v=1"></script>
</body>
</html>
